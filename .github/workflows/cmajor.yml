name: Cmajor compiler validation

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compile-patches:
    name: Compile Cmajor patches (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMAJOR_VERSION: "1.0.3209"
      CMAJOR_SHA256: "b7da026020c6afe823ff134d943631b741f531993292a38263736d7f08a47e7a"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2t64 unzip

      - name: Download and verify pinned Cmajor compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cmajor.linux.x64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/cmajor-lang/cmajor/releases/download/${CMAJOR_VERSION}/cmajor.linux.x64.zip" \
            --output "$archive"
          echo "${CMAJOR_SHA256}  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cmajor"
          unzip -q "$archive" -d "$RUNNER_TEMP/cmajor"
          compiler="$(find "$RUNNER_TEMP/cmajor" -type f -name cmaj -perm -u+x -print -quit)"
          test -n "$compiler"
          echo "CMAJ_BIN=$compiler" >> "$GITHUB_ENV"

      - name: Verify compiler version
        run: "$CMAJ_BIN" version

      - name: Compile both shipped patches to WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmajor-output"
          "$CMAJ_BIN" generate --target=wasm \
            --output="$RUNNER_TEMP/cmajor-output/codec" \
            cmajor/sogitech_codec.cmajorpatch
          "$CMAJ_BIN" generate --target=wasm \
            --output="$RUNNER_TEMP/cmajor-output/parameter-decoder" \
            cmajor/sogitech_param_decoder.cmajorpatch
