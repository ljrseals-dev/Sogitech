[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sogitech-codec"
version = "0.1.0"
description = "Hybrid analysis-resynthesis / parameter / neural codec built on the Sogitec OpticLink Hybrid engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ljrseals-dev / Lewis James Seals Jr." }
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.0; platform_system != 'Darwin' or platform_machine != 'arm64'",  # optional on Apple Silicon if needed
    "onnxruntime>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]
neural = [
    "torch>=2.0",
    "torchaudio>=2.0",
]
brute = [
    # Brute Genius is expected to be installed separately or via MCP;
    # this only provides the space / objective definitions.
]

[project.scripts]
sogitech-dsp-codec = "scripts.demo_dsp_codec:main"
sogitech-param-codec = "scripts.demo_param_codec:main"
sogitech-neural-codec = "scripts.demo_neural_codec:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
